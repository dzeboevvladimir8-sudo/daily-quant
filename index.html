<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Quant</title>
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="#/">Daily Quant</a>
      <nav aria-label="Main">
        <a href="#/" data-nav="today">Today</a>
        <a href="#/history" data-nav="history">History</a>
        <a href="#/mistakes" data-nav="mistakes">Mistakes <span class="count" id="mistake-count"></span></a>
      </nav>
      <div class="streak" id="streak" aria-live="polite"></div>
    </div>
  </header>
  <main class="wrap" id="app" tabindex="-1"><p class="muted">Loading…</p></main>
  <noscript><p class="wrap">Daily Quant needs JavaScript.</p></noscript>
</body>
</html>
